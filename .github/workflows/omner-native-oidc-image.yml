name: Omner native OIDC image

on:
  push:
    branches: [codex/hermex-native-oidc-v2026.8.19]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: omner-native-oidc-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish reviewed amd64 deployment image
        id: image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: docker/omner-native-oidc.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/luken/hermes-agent:omner-native-oidc-v2026.8.19
          build-args: |
            HERMES_GIT_SHA=${{ github.sha }}

      - name: Record immutable digest
        run: echo "ghcr.io/luken/hermes-agent@${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
